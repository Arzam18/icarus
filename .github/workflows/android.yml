name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Download NNUE Network
        run: |
          # build.rs checks for nets/icarus.nnue at compile time
          python3 ./download-net.py

      - name: Build Icarus for Android
        run: |
          cargo ndk -t arm64-v8a --platform 24 build --release -p icarus
          
          mkdir -p dist/bin
          cp target/aarch64-linux-android/release/icarus dist/bin/icarus

      - name: Verify Binary
        run: |
          ls -lh dist/bin/
          file dist/bin/*

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: icarus-android-arm64
          path: dist/bin/*
