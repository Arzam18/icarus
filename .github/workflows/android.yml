name: Build Android

on:
  workflow_dispatch:
    inputs:
      uci_date:
        description: "Icarus UCI version/date (example: 20260725)"
        required: true
        default: "20260725"
        type: string

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # Installs the target specifically for the active toolchain in rust-toolchain.toml
      - name: Ensure Target for Active Toolchain
        run: rustup target add aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Download NNUE Network
        run: |
          python3 ./download-net.py

      - name: Set Icarus UCI version
        env:
          UCI_DATE: ${{ inputs.uci_date }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          uci_date = os.environ["UCI_DATE"]

          path = Path("build.rs")
          text = path.read_text()

          old = 'let version = env::var("CARGO_PKG_VERSION").unwrap();'
          new = f'let version = "{uci_date}".to_string();'

          if old not in text:
              raise SystemExit(
                  "ERROR: Could not find CARGO_PKG_VERSION line in build.rs."
              )

          text = text.replace(old, new, 1)
          path.write_text(text)

          print(f"Modified file: {path}")
          print(f"Icarus UCI version: {uci_date}")
          PY

          echo "Modified version line:"
          grep -n 'let version =' build.rs

      - name: Build Icarus for Android
        env:
          ICARUS_RELEASE: "1"
        run: |
          cargo ndk -t arm64-v8a --platform 24 build --release -p icarus --config 'build.rustflags=[]'
          
          mkdir -p dist/bin
          cp target/aarch64-linux-android/release/icarus dist/bin/icarus

      - name: Verify Binary
        run: |
          ls -lh dist/bin/
          file dist/bin/*

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: icarus-android-arm64
          path: dist/bin/*
